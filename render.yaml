services:
  - type: web
    name: mediflow-server
    env: node
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: mediflow_super_secret_jwt_key_2026
